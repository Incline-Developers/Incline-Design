[package]
name = "minlp"
version = "0.1.0"
edition = "2024"
description = "A Rust port of the SCIP mixed-integer nonlinear programming solver"
license = "Apache-2.0"
repository = "https://github.com/Incline-Developers/Incline-Design"

[dependencies]
solver = { path = "../solver" }
log = "0.4"
web-time = "1.1.0"

# The browser has no C library to take `erf` from.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = "0.2.16"
