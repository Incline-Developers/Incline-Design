<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" width="540" height="290" role="img" aria-label="Geology workspace, Borehole Inspector Log tab, the seam menu opened on B: rename in this hole or every hole, move roof or floor, insert or delete an interval, then the four shift rows.">
  <g stroke="#000" stroke-width="1" fill="#fff">
    <rect x="62" y="44" width="80" height="226"/>
    <rect x="260" y="20" width="250" height="258"/>
  </g>
  <g stroke="#888" stroke-width="1" fill="none">
    <line x1="52" y1="44" x2="62" y2="44"/>
    <line x1="52" y1="270" x2="62" y2="270"/>
  </g>
  <rect x="62" y="134.4" width="80" height="7.5" fill="#ccc" stroke="#000" stroke-width="1"/>
  <rect x="62" y="209.7" width="80" height="5.7" fill="#ccc" stroke="#d9622b" stroke-width="3"/>
  <line x1="142" y1="212.5" x2="260" y2="34" stroke="#d9622b" stroke-width="3"/>
  <line x1="260" y1="46" x2="510" y2="46" stroke="#000" stroke-width="1"/>
  <line x1="260" y1="183" x2="510" y2="183" stroke="#000" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13" fill="#000">
    <text x="20" y="20" font-size="15" font-weight="bold">S2</text>
    <text x="102" y="36" text-anchor="middle" fill="#888">SEAM</text>
    <text x="48" y="48" text-anchor="end">0</text>
    <text x="48" y="274" text-anchor="end">60</text>
    <text x="102" y="142.7" text-anchor="middle">A</text>
    <text x="102" y="217" text-anchor="middle">B</text>
    <g text-anchor="middle" fill="#888">
      <text x="102" y="93.5">Not logged</text>
      <text x="102" y="180.3">Not logged</text>
      <text x="102" y="247.2">Not logged</text>
    </g>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#000">
    <text x="270" y="38">B</text>
    <text x="270" y="66">Rename in this hole</text>
    <text x="270" y="88">Rename in every hole</text>
    <text x="270" y="110">Move Roof...</text>
    <text x="270" y="132">Move Floor...</text>
    <text x="270" y="154">Insert Interval...</text>
    <text x="270" y="176">Delete Interval...</text>
    <text x="270" y="198">Up from here</text>
    <text x="270" y="220">All up</text>
    <text x="270" y="242">All down</text>
    <text x="270" y="264">Down from here</text>
  </g>
</svg>
