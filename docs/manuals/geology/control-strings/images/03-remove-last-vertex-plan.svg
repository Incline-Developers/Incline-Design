<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220" role="img" aria-label="Geology workspace, plan view, a string being drawn with its third vertex, near (1200, 1100), taken back so two vertices remain, near (1000, 1100) and (1100, 1100).">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9622b"/>
    </marker>
  </defs>
  <line x1="210" y1="120" x2="360" y2="120" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="120" x2="210" y2="120" stroke="#d9622b" stroke-width="3"/>
  <g fill="#888"><circle cx="360" cy="120" r="3"/></g>
  <g fill="#d9622b"><circle cx="60" cy="120" r="3"/><circle cx="210" cy="120" r="3"/></g>
  <g stroke="#000" stroke-width="1" fill="none"><line x1="505" y1="52" x2="505" y2="22" stroke="#d9622b" stroke-width="3" marker-end="url(#head)"/></g>
  <text x="505" y="16" font-family="sans-serif" font-size="15" fill="#000" text-anchor="middle">N</text>
  <g font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">
    <text x="60" y="148">(1000, 1100)</text>
    <text x="210" y="148">(1100, 1100)</text>
    <text x="360" y="148">(1200, 1100)</text>
  </g>
</svg>
