<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" role="img" aria-label="Geology workspace, plan view, one string from (1000, 1100, 79.0) to (1200, 1100, 77.0): vertex numbers 1, 2, 3 run from the west end before, and from the east end after Reverse String Direction.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9622b"/>
    </marker>
  </defs>
  <line x1="100" y1="100" x2="380" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="372" y1="100" x2="108" y2="100" stroke="#d9622b" stroke-width="3" marker-end="url(#head)"/>
  <g fill="#000"><circle cx="100" cy="100" r="3"/><circle cx="240" cy="100" r="3"/><circle cx="380" cy="100" r="3"/></g>
  <g font-family="sans-serif" font-size="15" fill="#888" text-anchor="middle"><text x="60" y="78" font-size="13">before</text><text x="60" y="130" font-size="13" fill="#d9622b">after</text><text x="100" y="78">1</text><text x="240" y="78">2</text><text x="380" y="78">3</text></g>
  <g font-family="sans-serif" font-size="15" fill="#d9622b" text-anchor="middle"><text x="100" y="130">3</text><text x="240" y="130">2</text><text x="380" y="130">1</text></g>
  <g font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">
    <text x="100" y="170">(1000, 1100, 79.0)</text><text x="240" y="170">(1100, 1100, 78.0)</text><text x="380" y="170">(1200, 1100, 77.0)</text>
  </g>
  <line x1="505" y1="52" x2="505" y2="24" stroke="#000" stroke-width="1"/>
  <path d="M505 23 l-3 6 l6 0 z" fill="#000"/>
  <text x="505" y="16" font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">N</text>
</svg>
