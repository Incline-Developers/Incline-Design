    <text x="78" y="154">S2</text><text x="250" y="154" text-anchor="end">2.000</text><text x="400" y="154" text-anchor="end">2.000</text><text x="500" y="154" text-anchor="end">1.15</text>
    <text x="78" y="178">S3</text><text x="250" y="178" text-anchor="end">2.000</text><text x="400" y="178" text-anchor="end">2.000</text><text x="500" y="178" text-anchor="end">1.15</text>
