    <rect x="70" y="10" width="460" height="230"/>
    <line x1="70" y1="36" x2="530" y2="36"/>
    <rect x="460" y="204" width="60" height="26"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#000">
    <text x="78" y="28" font-size="15">Thickness points: A thickness points</text>
