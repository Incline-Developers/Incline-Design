<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-label="Geology workspace, section view looking north: the part of the surface A Roof between S1 and S2, a line from RL 79.5 to RL 76, across the seam A roof picks">
