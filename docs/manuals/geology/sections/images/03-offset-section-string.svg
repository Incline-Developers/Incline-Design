<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-label="Geology workspace, section view looking north: the saved A Roof string as a grey dashed line and its offset, 2 m below it square to the string, in orange">
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="40" y1="40" x2="40" y2="240"/>
    <line x1="40" y1="240" x2="500" y2="240"/>
    <line x1="36" y1="80" x2="40" y2="80"/>
    <line x1="36" y1="160" x2="40" y2="160"/>
    <line x1="36" y1="240" x2="40" y2="240"/>
    <line x1="70" y1="240" x2="70" y2="244"/>
    <line x1="280" y1="240" x2="280" y2="244"/>
    <line x1="490" y1="240" x2="490" y2="244"/>
    <line x1="70" y1="40" x2="70" y2="240"/>
    <line x1="490" y1="40" x2="490" y2="240"/>
  </g>
  <g fill="#ccc" stroke="#000" stroke-width="1">
    <rect x="65" y="80" width="10" height="40"/>
    <rect x="485" y="160" width="10" height="40"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">
    <text x="30" y="84" text-anchor="end">80</text>
    <text x="30" y="164" text-anchor="end">76</text>
    <text x="30" y="244" text-anchor="end">72</text>
    <text x="54" y="30" text-anchor="end">RL (m)</text>
    <text x="499" y="164" text-anchor="start">Roof</text>
    <text x="499" y="204" text-anchor="start">Floor</text>
    <text x="70" y="262">0</text>
    <text x="280" y="262">100</text>
    <text x="490" y="262">200</text>
    <text x="280" y="284">Distance along the section (m)</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#000" text-anchor="middle">
    <text x="70" y="32">S1</text>
    <text x="490" y="32">S2</text>
  </g>
  <polyline points="70,90 280,130 490,160" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <polyline points="70,130 280,170 490,200" fill="none" stroke="#d9622b" stroke-width="3"/>
  <line x1="280" y1="130" x2="280" y2="170" stroke="#000" stroke-width="1"/>
  <text x="300" y="154" font-family="sans-serif" font-size="13" fill="#000" text-anchor="start">2 m</text>
  <text x="280" y="116" font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">Original</text>
  <text x="380" y="206" font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">Offset</text>
</svg>
