<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-label="Three evidence streams into the model. Exploration is drilling, seismic and CSAMT, sparse and years old. Mining and engineering is blastholes and mapped walls, dense and daily. Survey is every surface before and after it is dug. All three feed the model, which is published as a dated prediction and tested by reconciliation.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9622b"/>
    </marker>
  </defs>
  <g stroke="#d9622b" stroke-width="3" fill="none" marker-end="url(#head)">
    <line x1="210" y1="52" x2="248" y2="128"/>
    <line x1="210" y1="150" x2="248" y2="150"/>
    <line x1="210" y1="248" x2="248" y2="172"/>
    <line x1="400" y1="150" x2="428" y2="150"/>
    <path d="M480 182 L480 230 L325 230 L325 184"/>
  </g>
  <g stroke="#000" stroke-width="1" fill="#fff">
    <rect x="10" y="20" width="200" height="64"/>
    <rect x="10" y="118" width="200" height="64"/>
    <rect x="10" y="216" width="200" height="64"/>
    <rect x="250" y="118" width="150" height="64"/>
    <rect x="430" y="118" width="100" height="64"/>
    <rect x="273" y="236" width="104" height="28"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#000" text-anchor="middle">
    <text x="110" y="44">Exploration</text>
    <text x="110" y="142">Mining and engineering</text>
    <text x="110" y="240">Survey</text>
    <text x="325" y="142">The model</text>
    <text x="480" y="142">Published</text>
    <text x="325" y="255">Reconcile</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">
    <text x="110" y="64">drilling, seismic and CSAMT</text>
    <text x="110" y="78">years before mining</text>
    <text x="110" y="162">blastholes metres apart</text>
    <text x="110" y="176">walls mapped, every day</text>
    <text x="110" y="260">each surface before and after</text>
    <text x="110" y="274">hours to days</text>
    <text x="325" y="162">surfaces, strings</text>
    <text x="325" y="176">and points</text>
    <text x="480" y="162">a dated</text>
    <text x="480" y="176">prediction</text>
  </g>
</svg>
