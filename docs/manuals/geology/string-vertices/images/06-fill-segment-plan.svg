<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="540" height="230" role="img" aria-label="Geology workspace, plan view, Fill Segment at Spacing 60 cuts the string from (1000, 950, 80.00) to (1200, 950, 76.00) into four parts with new vertices at X 1050, 1100 and 1150.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9622b"/>
    </marker>
  </defs>
  <polyline points="70,150 470,150" fill="none" stroke="#d9622b" stroke-width="3"/>
  <g fill="#000"><circle cx="70" cy="150" r="3"/><circle cx="470" cy="150" r="3"/></g>
  <g fill="#d9622b"><circle cx="170" cy="150" r="3"/><circle cx="270" cy="150" r="3"/><circle cx="370" cy="150" r="3"/></g>
  <line x1="505" y1="52" x2="505" y2="22" stroke="#d9622b" stroke-width="3" marker-end="url(#head)"/>
  <text x="505" y="16" font-family="sans-serif" font-size="15" fill="#000" text-anchor="middle">N</text>
  <g font-family="sans-serif" font-size="13" fill="#000" text-anchor="middle">
