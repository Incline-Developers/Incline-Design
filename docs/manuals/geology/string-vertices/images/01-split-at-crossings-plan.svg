<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" role="img" aria-label="Geology workspace, plan view, string 1 from (1000, 1100, 79.0) to (1200, 1100, 77.0) cut into two strings at its crossing with string 2, the new vertices at (1100, 1100, 78.0).">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9622b"/>
    </marker>
  </defs>
  <line x1="100" y1="170" x2="380" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="30" x2="240" y2="310" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="170" x2="238" y2="170" stroke="#d9622b" stroke-width="3"/>
  <line x1="242" y1="170" x2="380" y2="170" stroke="#d9622b" stroke-width="3"/>
  <g fill="#000"><circle cx="100" cy="170" r="3"/><circle cx="238" cy="170" r="3"/><circle cx="242" cy="170" r="3"/><circle cx="380" cy="170" r="3"/></g>
