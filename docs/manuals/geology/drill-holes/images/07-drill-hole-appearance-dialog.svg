<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" role="img" aria-label="Any workspace, Drill Hole Appearance dialog, Field SEAM: Width card with Style String and discs, Colour scale card with rows A and B and the Reset colours button.">
  <g stroke="#000" stroke-width="1" fill="#fff">
    <rect x="60" y="10" width="420" height="310"/>
    <line x1="60" y1="40" x2="480" y2="40"/>
    <rect x="75" y="100" width="390" height="44"/>
    <rect x="75" y="165" width="390" height="115"/>
  </g>
  <g stroke="#000" stroke-width="1" fill="#fff">
    <rect x="75" y="195" width="16" height="16" fill="#ccc"/>
    <rect x="75" y="220" width="16" height="16" fill="#888"/>
  </g>
  <rect x="75" y="286" width="120" height="26" stroke="#d9622b" stroke-width="3" fill="#fff"/>
  <g font-family="sans-serif" fill="#000">
    <text x="75" y="31" font-size="15">Drill Hole Appearance: S-collars + 1 files</text>
    <text x="75" y="68" font-size="13">Field</text>
