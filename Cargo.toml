cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [".", "crates/mineflow", "crates/minlp", "crates/omf", "crates/solver"]
default-members = ["."]

[package]
name = "incline-design"
version = "0.4.0-dev"
edition = "2024"
description = "Free Open Source Mine Design"
repository = "https://github.com/Incline-Developers/Incline-Design"
license = "MIT"
keywords = ["mining", "cad", "design"]
categories = ["graphics", "science"]
exclude = [
    "target/",
    "docs/",
]

[build-dependencies]
winresource = "0.1.34"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
cosmic-text = "0.19.0"
dxf = "0.6.2"
earcut = "0.4.11"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
foldhash = "0.2.0"
fontmesh = "0.7.0"
gif = "0.14.2"
glam = { version = "0.34.1", features = ["serde"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
laz = { version = "0.13.0", features = ["parallel"] }
log = "0.4.34"
lyon = "1.0.19"
mineflow = { path = "crates/mineflow" }
minlp = { path = "crates/minlp" }
solver = { path = "crates/solver" }
omf = { path = "crates/omf", default-features = false, features = ["image", "parquet", "zlib-rs"] }
png = "0.18.1"
# `crs-definitions` feature omitted: only `from_proj_string` is used, and enabling it
# would pull in a second copy of the EPSG tables pinned to crs-definitions 0.5.
proj4rs = { version = "0.3.0", default-features = false }
crs-definitions = "0.6.0"
csv = "1.4.0"
# Animate's video export's AV1 encoder, pure Rust, on the shared rayon pool.
# Its `asm` feature (about 2.7x faster on x86-64) is left off: it needs nasm
# on every build machine.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
rayon = "1.12.0"
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
robust = "1.2.0"
rust-embed = { version = "8.13.0", default-features = false, features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
spade = "2.15.1"
strum = { version = "0.28.0", features = ["derive"] }
thousands = "0.2.0"
tiff = { version = "0.11.3", features = ["deflate", "fax", "jpeg", "lzw"], default-features = false }
twox-hash = "2.1.5"
unic-langid = { version = "0.9.6", features = ["macros"] }
uuid = { version = "1.28.0", features = ["js", "serde", "v4"] }
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
egui_system_font_provider = "0.37.0"
egui-winit = "0.37.0"
i18n-embed = { version = "0.16.0", features = ["desktop-requester"] }
memmap2 = "0.9.11"
pollster = "1.0.1"
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["links"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
web-sys = { version = "0.3.105", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "GainNode",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "ImageData",
    "MediaQueryList",
    "Navigator",
    "Node",
    "OscillatorNode",
    "OscillatorType",
    "Response",
    "Storage",
    "TextMetrics",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSCell", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObject", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_DirectManipulation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` expands to paths into `windows_core`.
windows-core = "0.62.2"

[profile.release]
debug = 0
strip = "symbols"
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
rustflags = ["-C", "force-frame-pointers=yes", "-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug-assertions = false
overflow-checks = false

[package.metadata.packager]
product-name = "Incline Design"
identifier = "net.inclinedesign.incline"
formats = ["app", "dmg"]
icons = ["res/Incline.iconset/*.png"]
category = "Productivity"
out-dir = "dist"
before-packaging-command = "cargo build --release"

[package.metadata.packager.dmg]
background = "res/dmg-background.png"
window-size = { width = 660, height = 400 }
app-position = { x = 180, y = 200 }
application-folder-position = { x = 480, y = 200 }

